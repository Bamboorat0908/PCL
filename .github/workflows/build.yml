name: BRCL release verification
on:
  push:
    branches: ['brcl/**']
    tags: ['brcl-v*']
  pull_request:
    branches: ['brcl/**']
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.404'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/verify-release.ps1 -OutputDirectory artifacts/verified-release
      - name: Upload validated EXE, ZIP and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BRCL-verified-release
          path: artifacts/verified-release/
