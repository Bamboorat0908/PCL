# Include inside the existing HTTPS server block.
# The updater intentionally uses the same signed relative paths on both origins.
location ^~ /BRCL/transfer/ {
    if ($uri !~ "^/BRCL/transfer/(latest\.(json|sig)|releases/BRCL-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.(zip|exe)|modpacks/TRM-1\.(10-high|11-(high|low))\.zip)$") {
        return 404;
    }
    limit_except GET { deny all; }
    alias /var/www/brcl-transfer/;
    types { application/json json; }
    default_type application/octet-stream;
    autoindex off;
    sendfile on;
    max_ranges 1;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /BRCL/transfer-mirror/ {
    if ($uri !~ "^/BRCL/transfer-mirror/(latest\.(json|sig)|releases/BRCL-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.(zip|exe)|modpacks/TRM-1\.(10-high|11-(high|low))\.zip)$") {
        return 404;
    }
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:25161/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
